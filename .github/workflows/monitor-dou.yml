name: Monitor DOU

concurrency:
  group: monitor-dou-main
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "07 08 * * *"
    - cron: "23 10 * * *"
    - cron: "17 15 * * *"
    - cron: "19 00 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Rodar monitor
        run: |
          python src/monitor_dou.py

      - name: Commit do histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage/historico_monitoramento_dou.csv storage/novidades_dou.csv

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "Atualiza histórico do monitor DOU"

          git pull --rebase origin main
          git push origin main
