name: Monitor DOU

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
    - cron: "23 13 * * *"
    - cron: "11 16 * * *"
    - cron: "19 21 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Rodar monitor
        run: |
          python src/monitor_dou.py

      - name: Commit do histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/historico_monitoramento_dou.csv storage/novidades_dou.csv
          git diff --cached --quiet || git commit -m "Atualiza histórico do monitor DOU"
          git push